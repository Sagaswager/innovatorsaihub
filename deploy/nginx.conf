# HTTPS terminates at the existing VPS proxy, not in this container.
map $http_x_forwarded_proto $website_hsts {
    default "";
    https "max-age=63072000; includeSubDomains; preload";
}

server {
    listen 80;
    server_name innovatorsaihub.com;
    location = /healthz { return 200 "ok\n"; }
    location / { return 308 https://www.innovatorsaihub.com$request_uri; }
}

server {
    listen 80 default_server;
    server_name www.innovatorsaihub.com _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security $website_hsts always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Preserve the current canonical routes from vercel.json.
    location = /home { return 308 /$is_args$args; }
    location /home/ { rewrite ^/home/(.*)$ /$1 permanent; }
    location ~ ^/(whatsapp|whatsapp-agent|whatsappautomation)/?$ {
        return 308 /whatsapp-ai-agent$is_args$args;
    }
    location ~ ^/(linkedin|linkedin-agent|linkedinoutreach)/?$ {
        return 308 /linkedin-ai-agent$is_args$args;
    }

    # Preserve the existing external WhatsApp app rewrite, including subpaths.
    location ~ ^/WhatsAppautomaton(?:/|$) {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $whatsapp_backend https://wa.innovatorsaihub.com;
        proxy_pass $whatsapp_backend$request_uri;
        proxy_set_header Host wa.innovatorsaihub.com;
        proxy_ssl_server_name on;
        proxy_ssl_name wa.innovatorsaihub.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        # Do not cache a missing asset response.
        add_header Cache-Control "public, immutable";
    }
    location = /robots.txt {
        try_files $uri =404;
        expires 1d;
    }
    location = /sitemap.xml {
        try_files $uri =404;
        expires 1d;
    }
    location = /llms.txt {
        try_files $uri =404;
        expires 1d;
    }
    location ~* \.(webp|png|jpe?g|gif|svg|ico|mp4)$ {
        try_files $uri =404;
        expires 7d;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security $website_hsts always;
    }
    # Direct visits and refreshes of React routes must serve the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
