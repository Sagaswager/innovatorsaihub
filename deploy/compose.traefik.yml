# Standalone production candidate for a verified shared bridge network.
# Supply the existing Traefik names in Hostinger's Environment fields.
# Do not deploy this candidate until Traefik network mode is confirmed.
services:
  website:
    build:
      context: https://github.com/Sagaswager/innovatorsaihub.git#hostinger-vps
      args:
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-G-FRNF7K23EF}
        VITE_META_PIXEL_ID: ${VITE_META_PIXEL_ID:-}
    restart: unless-stopped
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?Set the existing shared Traefik network}
      traefik.http.services.iah-website.loadbalancer.server.port: "80"
      traefik.http.routers.iah-website.rule: Host(`innovatorsaihub.com`) || Host(`www.innovatorsaihub.com`)
      traefik.http.routers.iah-website.entrypoints: ${TRAEFIK_HTTPS_ENTRYPOINT:?Set the existing HTTPS entrypoint}
      traefik.http.routers.iah-website.service: iah-website
      traefik.http.routers.iah-website.tls: "true"
      traefik.http.routers.iah-website.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:?Set the existing certificate resolver}
      traefik.http.routers.iah-website-http.rule: Host(`innovatorsaihub.com`) || Host(`www.innovatorsaihub.com`)
      traefik.http.routers.iah-website-http.entrypoints: ${TRAEFIK_HTTP_ENTRYPOINT:?Set the existing HTTP entrypoint}
      traefik.http.routers.iah-website-http.service: iah-website
      traefik.http.routers.iah-website-http.middlewares: iah-website-https
      traefik.http.middlewares.iah-website-https.redirectscheme.scheme: https
      traefik.http.middlewares.iah-website-https.redirectscheme.permanent: "true"
networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:?Set the existing shared Traefik network}
