# Production routing for the verified host-network Traefik Docker provider.
services:
  website:
    build:
      # Explicit Git context works even if Hostinger fetches only this YAML.
      context: https://github.com/Sagaswager/innovatorsaihub.git#hostinger-vps
      args:
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-G-FRNF7K23EF}
        VITE_META_PIXEL_ID: ${VITE_META_PIXEL_ID:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBSITE_PORT:-8088}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.iah-website.loadbalancer.server.port=80"
      - "traefik.http.routers.iah-website-vps.rule=Host(`innovatorsaihub.com`) || Host(`www.innovatorsaihub.com`)"
      - "traefik.http.routers.iah-website-vps.entrypoints=websecure"
      - "traefik.http.routers.iah-website-vps.tls=true"
      - "traefik.http.routers.iah-website-vps.tls.certresolver=letsencrypt"
      - "traefik.http.routers.iah-website-vps.service=iah-website"
