name: Deploy website to Hostinger VPS

on:
  push:
    branches: [hostinger-vps]
    paths-ignore:
      - '**/*.md'
      - 'deploy.ps1'

permissions:
  contents: read

concurrency:
  group: innovatorsaihub-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v4

      - name: Validate deployment and rollback logic
        shell: bash
        run: |
          bash -n deploy/remote-deploy.sh
          bash deploy/remote-deploy.test.sh

      - name: Check one-time SSH setup
        shell: bash
        run: |
          set -eu
          if [ -z "$VPS_SSH_PRIVATE_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo '::error::Add VPS_SSH_PRIVATE_KEY and VPS_KNOWN_HOSTS in repository Actions secrets before deployment.'
            exit 1
          fi

      - name: Rebuild website and verify health
        shell: bash
        run: |
          set -eu
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            root@187.127.187.153 'bash -se' < deploy/remote-deploy.sh
          echo 'Deployment completed; readiness, rollback guard and health checks passed.'
